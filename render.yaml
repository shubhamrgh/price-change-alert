services:
  - type: web
    name: trailify
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: TRAILIFY_VAPID_PUBLIC_KEY
        sync: false
      - key: TRAILIFY_VAPID_PRIVATE_KEY
        sync: false
      - key: TRAILIFY_VAPID_SUBJECT
        value: mailto:alerts@trailify.app
      - key: TRAILIFY_BASE_URL
        sync: false
      - key: TRAILIFY_EMAIL_ENABLED
        value: "false"
      - key: TRAILIFY_EMAIL_FROM
        sync: false
      - key: TRAILIFY_AUTH_EMAIL_ENABLED
        value: "false"
      - key: TRAILIFY_AUTH_EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TRAILIFY_PASSKEY_RP_ID
        value: price-change-alert.onrender.com
      - key: TRAILIFY_PASSKEY_RP_NAME
        value: Trailify
      - key: TRAILIFY_PASSKEY_ORIGINS
        value: https://price-change-alert.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: TRAILIFY_TELEGRAM_BOT_TOKEN
        sync: false
