# Public deployment profile. Supply database and VAPID values as environment variables.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
logging.file.name=${LOG_FILE:/tmp/price-change-alert.log}
server.forward-headers-strategy=framework

# Enable the public keep-alive for every production deployment. Environment
# variables can still override these values, but an existing Render service
# does not need to re-sync render.yaml for the scheduler to start.
price-change-alert.keep-alive.enabled=${PRICE_CHANGE_ALERT_KEEP_ALIVE_ENABLED:true}
price-change-alert.keep-alive.url=${PRICE_CHANGE_ALERT_KEEP_ALIVE_URL:https://price-change-alert.onrender.com/actuator/health/liveness}
