spring.application.name=trailify
# Render (and other managed hosts) provide the listening port through PORT.
# Keep 8080 as the local-development default.
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Local development database. Production uses the `prod` profile and PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/trailify;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Keep local-only secrets outside the repository. Production supplies these as
# TRAILIFY_VAPID_* environment variables; push is disabled if they are absent.
spring.config.import=optional:file:./backend/application-local.properties,optional:file:./application-local.properties

# Web Push VAPID keys - npx web-push generate-vapid-keys
trailify.vapid.public-key=${TRAILIFY_VAPID_PUBLIC_KEY:}
trailify.vapid.private-key=${TRAILIFY_VAPID_PRIVATE_KEY:}
trailify.vapid.subject=${TRAILIFY_VAPID_SUBJECT:mailto:alerts@trailify.app}

# How often the alert engine polls prices (ms)
trailify.poll.interval-ms=30000
trailify.poll.max-quote-age=2m
trailify.base-url=${TRAILIFY_BASE_URL:http://localhost:8080}

# Account sessions are opaque, HttpOnly cookies. Set this to a shorter value if
# the deployment needs stricter session rotation.
trailify.auth.session-ttl=30d
trailify.auth.magic-link-ttl=15m
trailify.auth.password-reset-ttl=30m
trailify.auth.email.enabled=${TRAILIFY_AUTH_EMAIL_ENABLED:${TRAILIFY_EMAIL_ENABLED:false}}
trailify.auth.email.from=${TRAILIFY_AUTH_EMAIL_FROM:${TRAILIFY_EMAIL_FROM:}}
trailify.auth.google.client-id=${GOOGLE_CLIENT_ID:}
trailify.auth.passkeys.challenge-ttl=5m
trailify.auth.passkeys.rp-id=${TRAILIFY_PASSKEY_RP_ID:localhost}
trailify.auth.passkeys.rp-name=${TRAILIFY_PASSKEY_RP_NAME:Trailify}
trailify.auth.passkeys.origins=${TRAILIFY_PASSKEY_ORIGINS:http://localhost:8080,http://localhost:5173}

# Notification delivery uses a transactional outbox. Provider credentials are
# supplied via environment variables, never through the browser.
trailify.notifications.dispatch.interval-ms=10000
trailify.notifications.dispatch.max-attempts=5
trailify.notifications.email.enabled=${TRAILIFY_EMAIL_ENABLED:false}
trailify.notifications.email.from=${TRAILIFY_EMAIL_FROM:}
trailify.notifications.telegram.bot-token=${TRAILIFY_TELEGRAM_BOT_TOKEN:}

# SMTP transport used by the email notification provider.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
management.health.mail.enabled=${TRAILIFY_EMAIL_ENABLED:false}

# Bounded local caches. These collapse duplicate requests on a single app
# instance while keeping quote data fresh enough for the 30-second alert poll.
trailify.cache.quote-ttl=20s
trailify.cache.quote-negative-ttl=5s
trailify.cache.quote-maximum-size=2000
trailify.cache.search-ttl=10m
trailify.cache.search-negative-ttl=30s
trailify.cache.search-maximum-size=3000
trailify.cache.chart-ttl=5m
trailify.cache.chart-negative-ttl=30s
trailify.cache.chart-maximum-size=1000
trailify.cache.logo-ttl=24h
trailify.cache.logo-negative-ttl=1h
trailify.cache.logo-maximum-size=2000

logging.level.org.hibernate.SQL=warn
logging.level.com.trailify=info
logging.file.name=logs/trailify.log
logging.file.max-size=5MB
logging.file.max-history=3
server.forward-headers-strategy=framework

