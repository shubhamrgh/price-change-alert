spring.application.name=price-change-alert
server.port=8080

# Local development database. Production uses the `prod` profile and PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/pricedrop;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Keep local-only secrets outside the repository. Production supplies these as
# PRICE_CHANGE_ALERT_VAPID_* environment variables; push is disabled if they are absent.
spring.config.import=optional:file:./backend/application-local.properties,optional:file:./application-local.properties

# Web Push VAPID keys - npx web-push generate-vapid-keys
price-change-alert.vapid.public-key=${PRICE_CHANGE_ALERT_VAPID_PUBLIC_KEY:}
price-change-alert.vapid.private-key=${PRICE_CHANGE_ALERT_VAPID_PRIVATE_KEY:}
price-change-alert.vapid.subject=${PRICE_CHANGE_ALERT_VAPID_SUBJECT:mailto:alerts@price-change-alert.app}

# How often the alert engine polls prices (ms)
price-change-alert.poll.interval-ms=30000
price-change-alert.base-url=${PRICE_CHANGE_ALERT_BASE_URL:http://localhost:8080}

logging.level.org.hibernate.SQL=warn
logging.level.com.pricedrop=info
logging.file.name=logs/price-change-alert.log
logging.file.max-size=5MB
logging.file.max-history=3
