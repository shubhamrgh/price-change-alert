spring.application.name=price-change-alert
# Render (and other managed hosts) provide the listening port through PORT.
# Keep 8080 as the local-development default.
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Local development database. Production uses the `prod` profile and PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/price-change-alert;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Keep local-only secrets outside the repository. Production supplies these as
# PRICE_CHANGE_ALERT_VAPID_* environment variables; push is disabled if they are absent.
spring.config.import=optional:file:./backend/application-local.properties,optional:file:./application-local.properties

# Web Push VAPID keys - npx web-push generate-vapid-keys
price-change-alert.vapid.public-key=${PRICE_CHANGE_ALERT_VAPID_PUBLIC_KEY:}
price-change-alert.vapid.private-key=${PRICE_CHANGE_ALERT_VAPID_PRIVATE_KEY:}
price-change-alert.vapid.subject=${PRICE_CHANGE_ALERT_VAPID_SUBJECT:mailto:alerts@price-change-alert.app}

# How often the alert engine polls prices (ms)
price-change-alert.poll.interval-ms=30000
price-change-alert.poll.max-quote-age=2m
price-change-alert.base-url=${PRICE_CHANGE_ALERT_BASE_URL:http://localhost:8080}

# Account sessions are opaque, HttpOnly cookies. Set this to a shorter value if
# the deployment needs stricter session rotation.
price-change-alert.auth.session-ttl=30d

# Notification delivery uses a transactional outbox. Provider credentials are
# supplied via environment variables, never through the browser.
price-change-alert.notifications.dispatch.interval-ms=10000
price-change-alert.notifications.dispatch.max-attempts=5
price-change-alert.notifications.email.enabled=${PRICE_CHANGE_ALERT_EMAIL_ENABLED:false}
price-change-alert.notifications.email.from=${PRICE_CHANGE_ALERT_EMAIL_FROM:}
price-change-alert.notifications.telegram.bot-token=${PRICE_CHANGE_ALERT_TELEGRAM_BOT_TOKEN:}

# SMTP transport used by the email notification provider.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
management.health.mail.enabled=${PRICE_CHANGE_ALERT_EMAIL_ENABLED:false}

# Bounded local caches. These collapse duplicate requests on a single app
# instance while keeping quote data fresh enough for the 30-second alert poll.
price-change-alert.cache.quote-ttl=20s
price-change-alert.cache.quote-negative-ttl=5s
price-change-alert.cache.quote-maximum-size=2000
price-change-alert.cache.search-ttl=10m
price-change-alert.cache.search-negative-ttl=30s
price-change-alert.cache.search-maximum-size=3000
price-change-alert.cache.chart-ttl=5m
price-change-alert.cache.chart-negative-ttl=30s
price-change-alert.cache.chart-maximum-size=1000
price-change-alert.cache.logo-ttl=24h
price-change-alert.cache.logo-negative-ttl=1h
price-change-alert.cache.logo-maximum-size=2000

logging.level.org.hibernate.SQL=warn
logging.level.com.pricechangealert=info
logging.file.name=logs/price-change-alert.log
logging.file.max-size=5MB
logging.file.max-history=3
server.forward-headers-strategy=framework

